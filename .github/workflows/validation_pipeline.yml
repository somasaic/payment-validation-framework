name: Payment Method Validation Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'    # Nightly 2AM UTC
  workflow_dispatch:
    inputs:
      region:
        description: 'Region filter (e.g. US, GB, IN) — leave blank for all'
        required: false
        default: ''
      target:
        description: 'mock = local mock sites, live = real website URLs from the dataset'
        required: false
        default: 'mock'
        type: choice
        options: [mock, live]

env:
  PYTHON_VERSION: "3.11"

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run unit tests
        run: pytest -m unit --junitxml=reports/junit-unit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-unit
          path: reports/junit-unit.xml

  api-tests:
    name: API Tests — pytest + Postman
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt

      - name: pytest API suite
        run: pytest -m api --junitxml=reports/junit-api.xml

      - name: Start mock merchant service
        run: |
          python -m mock_merchant --port 8000 > reports/mock-server.log 2>&1 &
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:8000/health; do sleep 1; done'

      - name: Postman collection (Newman)
        run: |
          npx --yes newman@6 run postman/payment-validation-api.postman_collection.json \
            -e postman/local.postman_environment.json \
            --reporters cli,junit --reporter-junit-export reports/junit-postman.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: reports/

  ui-tests:
    name: UI Tests — Page Object Model
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps
      - name: Run UI suite
        run: >
          pytest -m ui --browser chromium
          --tracing retain-on-failure --screenshot only-on-failure --output test-results
          --html reports/ui-report.html --self-contained-html
          --junitxml=reports/junit-ui.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-results
          path: |
            reports/
            test-results/
          retention-days: 14

  integration-tests:
    name: Integration Tests — Pipeline vs Ground Truth
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps
      - name: Run integration suite
        run: pytest -m integration --junitxml=reports/junit-integration.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: reports/
          retention-days: 14

  validation-pipeline:
    name: Site Validation — ${{ matrix.region }}
    runs-on: ubuntu-latest
    needs: [ui-tests, integration-tests]
    strategy:
      matrix:
        region: [US, GB, DE, JP, AU, SG]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps
      - name: Run validation — ${{ matrix.region }}
        run: python run_validation.py --region ${{ matrix.region }} --mock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.region }}
          path: |
            reports/validation_results_*.csv
            reports/review_queue_*.csv
            reports/screenshots/
          retention-days: 30

  master-dataset:
    name: Master Dataset — Store Locations
    runs-on: ubuntu-latest
    needs: [ui-tests, integration-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps
      - name: Validate master dataset
        run: |
          ARGS="--workers 4 --output reports/master_validated.csv"
          if [ -n "${{ github.event.inputs.region }}" ]; then ARGS="$ARGS --region ${{ github.event.inputs.region }}"; fi
          if [ "${{ github.event.inputs.target || 'mock' }}" = "mock" ]; then ARGS="$ARGS --mock"; fi
          python run_master_validation.py $ARGS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: master-dataset-validated
          path: |
            reports/master_validated.csv
            reports/screenshots/
          retention-days: 30

  full-run:
    name: Full Site Pipeline — All Regions
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps
      - name: Run full pipeline — all merchants
        run: |
          if [ "${{ github.event.inputs.target || 'mock' }}" = "mock" ]; then
            python run_validation.py --mock
          else
            python run_validation.py
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-validation-report
          path: reports/
          retention-days: 30
