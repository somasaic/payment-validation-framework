[pytest]
testpaths = tests
pythonpath = .
addopts = -v --tb=short --strict-markers
log_cli = true
log_cli_level = INFO
log_format = %(asctime)s [%(levelname)s] %(name)s - %(message)s
log_date_format = %H:%M:%S
markers =
    unit: Unit tests for scorer and utilities
    ui: Storefront checkout + store locator UI tests (Page Object Model)
    api: REST API contract tests (schemas, status codes, payloads)
    integration: End-to-end pipeline tests against mock storefronts
    smoke: Quick sanity run on 2-3 merchants
